default_install_hook_types:
  - pre-commit
  - post-checkout
  - post-merge
  - post-rewrite
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: 9026c9127e153371d7a78dfcb0c45ae2046a3d10  # frozen: v0.17.6
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [--fix]
      # Run the formatter.
      - id: ruff-format
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: 96cf601960471a908938372419287b8f5d3df15b  # frozen: v0.0.109
    hooks:
      - id: ty
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: d4df4cec471ce155946474590d7b95920f623ccb  # frozen: v0.24.2
    hooks:
      - id: markdownlint-cli2
        args: [--fix]
        exclude: ^\.(claude/skills/m5stack-stopwatch/|agents/skills|entire/)
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 00eaed0068329eb6ca6bcb8de7b46c372d8d1c19  # frozen: 0.13.9
    hooks:
      - id: uv-lock
      - id: uv-sync
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: 82d21874c3242e4dc27bb47641c996902ef64eef  # frozen: v0.27
    hooks:
      - id: validate-pyproject
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 07f0d02ea1d32edfbe4cbde9de9e9aa0a90ca711  # frozen: 44.251.0
    hooks:
      - id: renovate-config-validator
        args: [--strict]
