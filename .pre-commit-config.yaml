default_install_hook_types:
  - pre-commit
  - post-checkout
  - post-merge
  - post-rewrite
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: 25bcf95026b96e2dd3c0aec3090c3d6ef6ca2e6c  # frozen: v0.17.3
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [--fix]
      # Run the formatter.
      - id: ruff-format
  - repo: local
    hooks:
      - id: ty
        name: ty
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: cbcdc463be5464e25e3e955a511599a67b9b987f  # frozen: v0.50.0
    hooks:
      - id: markdownlint-fix
        exclude: ^\.(claude/skills/m5stack-stopwatch/|agents/skills|entire/)
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 46787482b9fb2003c56e0f7592e312ef381829d9  # frozen: 0.13.6
    hooks:
      - id: uv-lock
      - id: uv-sync
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: 82d21874c3242e4dc27bb47641c996902ef64eef  # frozen: v0.27
    hooks:
      - id: validate-pyproject
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 7758680838dd0daf961b48b9abab76ca114cf671  # frozen: 44.190.0
    hooks:
      - id: renovate-config-validator
        args: [--strict]
