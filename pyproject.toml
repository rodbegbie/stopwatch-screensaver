[project]
name = "stopwatch-screensaver"
version = "0.0.0"
requires-python = "==3.14.10"
dependencies = []

[dependency-groups]
dev = [
    "machfs",
    "pillow",
    "platformio==6.2.0",
    "pre-commit>=4.7.0",
    "pytest",
    "ruff==0.17.3",
    "ty>=0.0.88",
]

[tool.uv]
package = false
exclude-newer = "3 days"
# ruff 0.17.3 (27 Oct 2026) is pinned exactly but is under 3 days old; drop this after 30 Oct 2026
exclude-newer-package = { ruff = "2026-10-28T00:00:00Z" }
