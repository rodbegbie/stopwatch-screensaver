build_flags =
    -g
    -fsanitize=address
    -fno-omit-frame-pointer
    -Isrc
    -Isrc/x11shim/include
    -Isrc/xs_support
    -Isrc/xs_support/glx
    -DSTANDALONE
    -DHAVE_MOBILE
    -DXSHIM_NATIVE
    -lz

