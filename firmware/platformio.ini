[platformio]
default_envs = stopwatch

[env:stopwatch]
platform = espressif32 @ 6.12.0
board = esp32s3box
framework = arduino
board_build.partitions = app3M_fat9M_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
upload_port = /dev/cu.usbmodem112401
monitor_port = /dev/cu.usbmodem112401
build_src_filter = +<*> -<../native/> -<hacks/galaxy/galaxy.c> -<hacks/flame/flame.c> -<hacks/discrete/discrete.c> -<hacks/drift/drift.c> -<hacks/maze/maze.c> -<hacks/blaster/blaster.c> -<hacks/substrate/substrate.c> -<hacks/pacman/pacman_level.c> -<hacks/pacman/pacman_ai.c> -<hacks/braid/braid.c>
extra_scripts = pre:patch_maze.py, pre:patch_pacman.py, pre:patch_float_literals.py, pre:logo_override.py, pre:pacman_sprites.py
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -Isrc
    -Isrc/x11shim/include
    -Isrc/xs_support
    -DSTANDALONE
    -DHAVE_MOBILE
lib_deps =
    M5Unified = https://github.com/m5stack/M5Unified#fd40d58
    M5GFX = https://github.com/m5stack/M5GFX#c5a3fef
    M5PM1 = https://github.com/m5stack/M5PM1#be9a545
    M5IOE1 = https://github.com/m5stack/M5IOE1#846eec7

; Throwaway TinyGL spike: firmware/src/hacks/tglspike and firmware/spike_tinygl.
[env:spike]
extends = env:stopwatch
build_src_filter = ${env:stopwatch.build_src_filter} +<../spike_tinygl/src/*.c>
build_flags =
    ${env:stopwatch.build_flags}
    -DTGL_SPIKE
    -Ispike_tinygl/include
    -Ispike_tinygl/src

[env:spike_dump]
extends = env:dump
build_src_filter = ${env:dump.build_src_filter} +<../spike_tinygl/src/*.c>
build_flags =
    ${env:dump.build_flags}
    -DTGL_SPIKE
    -Ispike_tinygl/include
    -Ispike_tinygl/src

[env:native]
platform = platformio/native
test_framework = unity
test_build_src = yes
extra_scripts = pre:patch_maze.py, pre:patch_pacman.py, pre:patch_float_literals.py, pre:logo_override.py, pre:pacman_sprites.py
build_src_filter = +<*> -<main.cpp> -<hacks/galaxy/galaxy.c> -<hacks/flame/flame.c> -<hacks/discrete/discrete.c> -<hacks/drift/drift.c> -<hacks/maze/maze.c> -<hacks/blaster/blaster.c> -<hacks/substrate/substrate.c> -<hacks/pacman/pacman_level.c> -<hacks/pacman/pacman_ai.c> -<hacks/braid/braid.c>
build_flags =
    -g
    -fsanitize=address
    -fno-omit-frame-pointer
    -Isrc
    -Isrc/x11shim/include
    -Isrc/xs_support
    -DSTANDALONE
    -DHAVE_MOBILE
    -DXSHIM_NATIVE

[env:dump]
platform = platformio/native
build_src_filter = +<*> -<main.cpp> -<hacks/galaxy/galaxy.c> -<hacks/flame/flame.c> -<hacks/discrete/discrete.c> -<hacks/drift/drift.c> -<hacks/maze/maze.c> -<hacks/blaster/blaster.c> -<hacks/substrate/substrate.c> -<hacks/pacman/pacman_level.c> -<hacks/pacman/pacman_ai.c> -<hacks/braid/braid.c> +<../native/dump_main.c>
extra_scripts = pre:patch_maze.py, pre:patch_pacman.py, pre:patch_float_literals.py, pre:logo_override.py, pre:pacman_sprites.py
build_flags =
    -g
    -Isrc
    -Isrc/x11shim/include
    -Isrc/xs_support
    -DSTANDALONE
    -DHAVE_MOBILE
