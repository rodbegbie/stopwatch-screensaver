[platformio]
default_envs = stopwatch

[env:stopwatch]
platform = espressif32 @ 6.12.0
board = esp32s3box
framework = arduino
board_build.partitions = app3M_fat9M_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
upload_port = /dev/cu.usbmodem112401
monitor_port = /dev/cu.usbmodem112401
build_src_filter = +<*> -<../native/> -<hacks/galaxy/galaxy.c> -<hacks/xspirograph/xspirograph.c> -<hacks/vines/vines.c> -<hacks/hopalong/hopalong.c> -<hacks/whirlwindwarp/whirlwindwarp.c> -<hacks/barcode/barcode.c> -<hacks/flame/flame.c> -<hacks/discrete/discrete.c> -<hacks/drift/drift.c> -<hacks/maze/maze.c> -<hacks/blaster/blaster.c> -<hacks/substrate/substrate.c> -<hacks/pacman/pacman_level.c> -<hacks/pacman/pacman_ai.c> -<hacks/braid/braid.c> -<hacks/deluxe/deluxe.c> -<hacks/lmorph/lmorph.c> -<hacks/hexadrop/hexadrop.c> -<hacks/halo/halo.c> -<hacks/xmatrix/xmatrix.c> -<hacks/fireworkx/fireworkx.c> -<hacks/starfish/starfish.c> -<hacks/goop/goop.c> -<hacks/euler2d/euler2d.c> -<hacks/wormhole/wormhole.c> -<hacks/interaggregate/interaggregate.c> -<hacks/ifs/ifs.c> -<hacks/halftone/halftone.c> -<hacks/fuzzyflakes/fuzzyflakes.c> -<hacks/compass/compass.c> -<hacks/anemotaxis/anemotaxis.c> -<hacks/anemone/anemone.c> -<hacks/cwaves/cwaves.c> -<hacks/celtic/celtic.c> -<hacks/moire/moire.c> -<hacks/moire2/moire2.c> -<tinygl/> -<hacks/gears/> -<hacks/morph3d/> -<hacks/cubicgrid/> -<hacks/boing/> -<hacks/boing_gl.c> -<hacks/hextrail/> -<hacks/stonerview/> -<hacks/hypnowheel/> -<hacks/hypnowheel_gl.c> -<hacks/qix/qix.c> -<hacks/loop/loop.c> -<hacks/unknownpleasures/> -<xs_support/glx/> -<hacks/eruption/eruption.c> -<hacks/piecewise/piecewise.c> -<hacks/interference/interference.c> -<hacks/binaryring/binaryring.c> -<hacks/graphstat/> -<hacks/etruscanvenus/> -<hacks/blocktube/> -<hacks/blocktube_single_gl.c> -<hacks/triangle/triangle.c> -<hacks/xrayswarm/xrayswarm.c> -<hacks/lisa/lisa.c> -<hacks/penrose/penrose.c> -<hacks/xjack/xjack.c> -<hacks/pipes/> -<hacks/bubble3d/> -<hacks/binaryhorizon/binaryhorizon.c> -<hacks/rotzoomer/rotzoomer.c> -<hacks/twang/twang.c> -<hacks/nerverot/nerverot.c> -<hacks/hyperball/hyperball.c> -<hacks/marbling/marbling.c> -<hacks/droste/droste.c> -<hacks/polyominoes/polyominoes.c> -<hacks/ccurve/ccurve.c> -<hacks/munch/munch.c>
extra_scripts = pre:patch_maze.py, pre:patch_pacman.py, pre:patch_polyominoes.py, pre:patch_float_literals.py, pre:logo_override.py, pre:pacman_sprites.py, pre:matrix_glyphs.py, pre:patch_tinygl.py, pre:after_dark_sprites.py, pre:vendor_data.py, pre:patch_penrose.py, pre:grab_image.py, pre:font_atlas.py, pre:teapot_table.py
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -Isrc
    -Isrc/x11shim/include
    -Isrc/xs_support
    -Isrc/xs_support/glx
    -DSTANDALONE
    -DHAVE_MOBILE
lib_deps =
    M5Unified = https://github.com/m5stack/M5Unified#fd40d58
    M5GFX = https://github.com/m5stack/M5GFX#c5a3fef
    M5PM1 = https://github.com/m5stack/M5PM1#be9a545
    M5IOE1 = https://github.com/m5stack/M5IOE1#846eec7

[env:native]
platform = platformio/native
test_framework = unity
test_build_src = yes
